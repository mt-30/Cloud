name: Cloud Tasks API - CI CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # ETAPA 1 - QUALIDADE E TESTES
  quality-and-tests:
    name: Quality and Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cloud-pipeline-starter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Check code quality
        run: |
          flake8 app --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Run automated tests
        run: python -m pytest -v

  # ETAPA 2 - BUILD E TESTE DO DOCKER
  docker-test:
    name: Docker Build and Test
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cloud-tasks-api:test \
            ./cloud-pipeline-starter

      - name: Run Docker container
        run: |
          docker run -d \
            --name cloud-tasks-test \
            -p 8080:8000 \
            cloud-tasks-api:test

      - name: Wait and test API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "API funcionando dentro do Docker!"
              exit 0
            fi
            sleep 2
          done

          docker logs cloud-tasks-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f cloud-tasks-test || true

  # ETAPA 3 - PUBLICAR IMAGEM NO GHCR (SOMENTE PUSH NA MAIN)
  publish-ghcr:
    name: Publish Image to GHCR
    needs: docker-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build-image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE_URI="ghcr.io/${REPO_LOWER}:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE_URI" \
            ./cloud-pipeline-starter

          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ETAPA 4 - DEPLOY NA EC2
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: publish-ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy immutable image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          IMAGE_URI: ${{ needs.publish-ghcr.outputs.image_uri }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "bash -s" -- "$IMAGE_URI" < ./cloud-pipeline-starter/scripts/deploy.sh
