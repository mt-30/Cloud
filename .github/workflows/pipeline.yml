
name: Cloud Tasks API - CI CD

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ETAPA 1 - QUALIDADE E TESTES
  quality-and-tests:
    name: Quality and Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./cloud-pipeline-starter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Check code quality
        run: |
          flake8 app --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Run automated tests
        run: python -m pytest -v


  # ETAPA 2 - BUILD E TESTE DO DOCKER
  docker-test:
    name: Docker Build and Test
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cloud-tasks-api:test \
            ./cloud-pipeline-starter

      - name: Run Docker container
        run: |
          docker run -d \
            --name cloud-tasks-test \
            -p 8080:5000 \
            cloud-tasks-api:test

      - name: Wait and test API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "API funcionando dentro do Docker!"
              exit 0
            fi
            sleep 2
          done

          docker logs cloud-tasks-test
          exit 1

      - name: Stop test container
        if: always()
        run: |
          docker rm -f cloud-tasks-test || true


  # ETAPA 3 - PUBLICAR IMAGEM NO AMAZON ECR
  publish-ecr:
    name: Publish Image to Amazon ECR
    needs: docker-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: build-image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            -t "$IMAGE_URI" \
            ./cloud-pipeline-starter

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Imagem publicada: $IMAGE_URI"


  # ETAPA 4 - DEPLOY NA EC2
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: publish-ecr

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Login EC2 to Amazon ECR
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            ssh -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" \
              "sudo docker login --username AWS --password-stdin '$REGISTRY'"

      - name: Pull and run application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_URI: ${{ needs.publish-ecr.outputs.image_uri }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker pull '$IMAGE_URI' &&
             (sudo docker rm -f cloud-tasks-api || true) &&
             sudo docker run -d \
               --name cloud-tasks-api \
               --restart unless-stopped \
               -p 8080:5000 \
               -e DB_PATH=/data/cloud_tasks.db \
               -v cloud_tasks_data:/data \
               '$IMAGE_URI'"

      - name: Verify deployment health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "for i in \$(seq 1 30); do
               if curl -fsS http://localhost:8080/health; then
                 echo 'Deploy realizado com sucesso!'
                 exit 0
               fi
               sleep 2
             done
             sudo docker logs cloud-tasks-api
             exit 1"

